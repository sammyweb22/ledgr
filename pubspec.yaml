name: ledgr
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  cloud_firestore: ^7.1.0
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  fl_chart: ^1.3.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  intl: ^0.20.3
  ledgr_core:
    path: ../ledgr_core
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#673AB7"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

flutter_native_splash:
  color: "#FFFBFE"
  color_dark: "#141218"
  image: assets/icon/icon_foreground.png
  android_12:
    color: "#673AB7"
    image: assets/icon/icon_foreground.png